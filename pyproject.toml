[project]
name = "musicengine"
version = "0.1.0"
description = "IncuBrix AI background music engine: symbolic composition rendered to real stems"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "boto3>=1.34",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "pretty_midi>=0.2.10",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "langdetect>=1.0.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musicengine = ["styles/*.yaml", "interpreter/lexicon/*.yaml", "migrations.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs postgres + S3 (compose services)",
    "e2e: full stack incl. api + worker + real renderer",
    "fluidsynth: needs the fluidsynth binary and SoundFont",
]
