# Every component that ships in the service image or touches generated audio.
# Evidence (licence text read and quoted) is in SOURCES.md. Feeds manifest.components[].
components:
  - name: FluidR3_GM SoundFont
    version: "3.1 (Debian fluid-soundfont-gm 3.1-5.3)"
    licence: MIT
    licence_url: https://metadata.ftp-master.debian.org/changelogs/main/f/fluid-soundfont/unstable_copyright
    commercial_use: "Yes. MIT: 'to use, copy, modify, merge, publish, distribute, sublicense, and/or sell'. Rendered audio is our output, not a copy of the SoundFont."
    role: instrument samples (default renderer)
  - name: FluidSynth
    version: "2.3.x (Debian bookworm package)"
    licence: LGPL-2.1-or-later
    licence_url: https://metadata.ftp-master.debian.org/changelogs/main/f/fluidsynth/stable_copyright
    commercial_use: "Yes. Invoked as an unmodified separate program (subprocess); no linking. Output audio carries no licence obligation."
    role: MIDI to audio renderer
  - name: FFmpeg (Debian build incl. libmp3lame)
    version: "5.1.x (Debian bookworm package)"
    licence: GPL-2.0-or-later (Debian builds with --enable-gpl, no --enable-nonfree)
    licence_url: https://salsa.debian.org/multimedia-team/ffmpeg/-/raw/debian/7%255.1.6-0+deb12u1/debian/rules
    commercial_use: "Yes. Invoked as an unmodified separate program (subprocess); GPL obligations apply to redistribution of the binary (source offer from Debian), not to the audio it produces."
    role: mp3 encode, narration decode, independent loudness check
  - name: musicengine (this repository)
    version: "0.1.0"
    licence: Proprietary (owned code)
    licence_url: ./README.md
    commercial_use: "Yes. Composition rules, presets and DSP written for this project; no trained music model, no copied songs."
    role: prompt interpretation, composition, numpy synth/FX, mixing, QA
  - name: NumPy
    version: "2.x"
    licence: BSD-3-Clause
    licence_url: https://github.com/numpy/numpy/blob/main/LICENSE.txt
    commercial_use: "Yes (permissive)."
    role: DSP
  - name: SciPy
    version: "1.x"
    licence: BSD-3-Clause
    licence_url: https://github.com/scipy/scipy/blob/main/LICENSE.txt
    commercial_use: "Yes (permissive)."
    role: filters, resampling for true-peak
  - name: soundfile (+ bundled libsndfile)
    version: "0.12+"
    licence: BSD-3-Clause (libsndfile LGPL-2.1, dynamically loaded)
    licence_url: https://github.com/bastibe/python-soundfile/blob/master/LICENSE
    commercial_use: "Yes."
    role: WAV read/write
  - name: pyloudnorm
    version: "0.1+"
    licence: MIT
    licence_url: https://github.com/csteinmetz1/pyloudnorm/blob/master/LICENSE
    commercial_use: "Yes (permissive)."
    role: BS.1770 loudness
  - name: pretty_midi (+ mido)
    version: "0.2.x"
    licence: MIT
    licence_url: https://github.com/craffel/pretty-midi/blob/main/LICENSE.txt
    commercial_use: "Yes (permissive)."
    role: MIDI writing
  - name: langdetect
    version: "1.0.9"
    licence: Apache-2.0 (LICENSE file; PyPI metadata field says MIT, classifier says Apache)
    licence_url: https://github.com/Mimino666/langdetect/blob/master/LICENSE
    commercial_use: "Yes (permissive)."
    role: prompt language detection
  - name: FastAPI / Starlette / Uvicorn / Pydantic / pydantic-settings
    version: "current"
    licence: MIT / BSD-3-Clause / BSD-3-Clause / MIT / MIT
    licence_url: https://github.com/fastapi/fastapi/blob/master/LICENSE
    commercial_use: "Yes (permissive)."
    role: HTTP API
  - name: psycopg / psycopg-pool
    version: "3.x"
    licence: LGPL-3.0-only
    licence_url: https://github.com/psycopg/psycopg/blob/master/LICENSE.txt
    commercial_use: "Yes. Used unmodified as an installed library."
    role: PostgreSQL driver
  - name: boto3 / httpx / structlog / PyYAML / python-multipart
    version: "current"
    licence: Apache-2.0 / BSD-3-Clause / MIT OR Apache-2.0 / MIT / Apache-2.0
    licence_url: https://github.com/boto/boto3/blob/develop/LICENSE
    commercial_use: "Yes (permissive)."
    role: storage client, HTTP client, logging, config, uploads
  - name: PostgreSQL
    version: "16"
    licence: PostgreSQL License
    licence_url: https://www.postgresql.org/about/licence/
    commercial_use: "Yes (permissive)."
    role: jobs, idempotency, queue
  - name: MinIO server
    version: "RELEASE.2025-04-22T22-12-26Z"
    licence: AGPL-3.0
    licence_url: https://github.com/minio/minio/blob/master/LICENSE
    commercial_use: "Used unmodified as a separate network service for the demo. For production, point S3_* at a non-AGPL S3 backend (AWS S3, R2, etc.); no code change needed."
    role: object storage (demo / compose only)
