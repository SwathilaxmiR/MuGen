# Every component that ships in the service image or touches generated audio.
# Evidence (licence text read and quoted) is in SOURCES.md. Feeds manifest.components[].
components:
- name: FluidR3_GM SoundFont
  version: 3.1 (Debian fluid-soundfont-gm 3.1-5.3)
  licence: MIT
  licence_url: https://metadata.ftp-master.debian.org/changelogs/main/f/fluid-soundfont/unstable_copyright
  commercial_use: 'Yes. MIT: ''to use, copy, modify, merge, publish, distribute, sublicense, and/or sell''. Rendered
    audio is our output, not a copy of the SoundFont.'
  role: instrument samples (default renderer)
  clause: Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated
    documentation files (the "Software"), to deal in the Software without restriction
  clause_source: evidence/must_haves/mh4_licences/texts/fluidr3_debian_copyright.txt
- name: FluidSynth
  version: 2.3.x (Debian bookworm package)
  licence: LGPL-2.1-or-later
  licence_url: https://metadata.ftp-master.debian.org/changelogs/main/f/fluidsynth/stable_copyright
  commercial_use: Yes. Invoked as an unmodified separate program (subprocess); no linking. Output audio carries
    no licence obligation.
  role: MIDI to audio renderer
  clause: The act of running a program using the Library is not restricted, and output from such a program is covered
    only if its contents constitute a work based on the Library
  clause_source: evidence/must_haves/mh4_licences/texts/lgpl-2.1.txt
- name: FFmpeg (Debian build incl. libmp3lame)
  version: 5.1.x (Debian bookworm package)
  licence: GPL-2.0-or-later (Debian builds with --enable-gpl, no --enable-nonfree)
  licence_url: https://salsa.debian.org/multimedia-team/ffmpeg/-/raw/debian/7%255.1.6-0+deb12u1/debian/rules
  commercial_use: Yes. Invoked as an unmodified separate program (subprocess); GPL obligations apply to redistribution
    of the binary (source offer from Debian), not to the audio it produces.
  role: mp3 encode, narration decode, independent loudness check
  clause: The act of running the Program is not restricted, and the output from the Program is covered only if its
    contents constitute a work based on the Program
  clause_source: evidence/must_haves/mh4_licences/texts/gpl-2.0.txt
- name: musicengine (this repository)
  version: 0.1.0
  licence: Proprietary (owned code)
  licence_url: ./README.md
  commercial_use: Yes. Composition rules, presets and DSP written for this project; no trained music model, no copied
    songs.
  role: prompt interpretation, composition, numpy synth/FX, mixing, QA
  clause: Owned code written for this project.
- name: NumPy
  version: 2.x
  licence: BSD-3-Clause
  licence_url: https://github.com/numpy/numpy/blob/main/LICENSE.txt
  commercial_use: Yes (permissive).
