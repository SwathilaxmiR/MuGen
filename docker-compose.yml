x-app: &app
  build: .
  image: musicengine:local
  env_file:
    - {path: .env, required: false}
  environment:
    DATABASE_URL: postgresql://music:music@postgres:5432/music
    S3_ENDPOINT: http://minio:9000
  depends_on:
    postgres: {condition: service_healthy}
    minio-init: {condition: service_completed_successfully}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: music, POSTGRES_PASSWORD: music, POSTGRES_DB: music}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music"]
      interval: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports: ["9000:9000"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  minio-init:
    <<: *app
    restart: "no"
    command: ["python", "-m", "musicengine.cli", "init-bucket"]
    depends_on:
      minio: {condition: service_healthy}

  api:
    <<: *app
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 5s
      retries: 20

  worker:
    <<: *app
    command: ["python", "-m", "musicengine.worker.loop"]
    stop_grace_period: 30s

  tests:
    <<: *app
    profiles: ["tests"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://music:music@postgres:5432/music
      S3_ENDPOINT: http://minio:9000
      E2E_API_URL: http://api:8000
      # presigned links are signed for S3_PUBLIC_ENDPOINT; inside the network fetch them via minio
      S3_DOWNLOAD_REWRITE: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}=http://minio:9000
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_started}
    volumes: ["./out:/app/out"]
    command: ["pytest", "-q", "-rs", "-p", "no:cacheprovider"]

volumes:
  pgdata:
  miniodata:
